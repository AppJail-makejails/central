build:
  variants:
    - tag: %%BASE1%%
      containerfile: Containerfile
      aliases: ["latest"]
      default: true
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        NO_PKGCLEAN: "1"
      cache_dirs: ["%%PKGCACHE0%%"]
    - tag: %%BASE1%%-devel
      containerfile: Containerfile
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        FLAVOUR: '-devel'
        NO_PKGCLEAN: "1"
      cache_dirs: ["%%PKGCACHE0%%"]
    #
    # IGNORE: required at least GSSAPI_HEIMDAL or GSSAPI_MIT to be defined. Please do 'make config' again
