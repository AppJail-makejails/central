build:
  variants:
    - tag: %%BASE1%%
      containerfile: Containerfile
      aliases: ["latest"]
      default: true
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        NO_PKGCLEAN: "1"
      cache_dirs: ["%%PKGCACHE0%%"]
    - tag: %%BASE1%%-intel
      containerfile: Containerfile
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        NO_PKGCLEAN: "1"
        DRIVER: "intel"
      cache_dirs: ["%%PKGCACHE0%%"]
    - tag: %%BASE1%%-nvidia
      containerfile: Containerfile
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        NO_PKGCLEAN: "1"
        DRIVER: "nvidia"
      cache_dirs: ["%%PKGCACHE0%%"]
