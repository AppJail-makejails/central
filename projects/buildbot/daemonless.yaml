build:
  variants:
    - tag: %%BASE1%%-master
      containerfile: Containerfile.master
      aliases: ["latest"]
      default: true
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        PYVER: "%%PYVER%%"
        NO_PKGCLEAN: "1"
      cache_dirs: ["%%PKGCACHE0%%"]
    - tag: %%BASE1%%-worker
      containerfile: Containerfile.worker
      args:
        FREEBSD_RELEASE: "%%BASE1%%"
        PYVER: "%%PYVER%%"
        NO_PKGCLEAN: "1"
      cache_dirs: ["%%PKGCACHE0%%"]
